services:
  - type: web
    name: copyquick-staging
    runtime: node
    repo: https://github.com/danimi4336-spec/CopyQuick
    branch: next-gen
    # Staging deploys remain explicit so a push cannot change the acceptance
    # target while a release gate is in progress.
    autoDeployTrigger: off
    plan: 0.5c-512mb
    disk:
      name: copyquick-staging-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_PATH
        value: /var/data/copyquick-staging.db
      - key: PERSISTENT_DATA_DIR
        value: /var/data
      - key: DATABASE_BACKUP_DIR
        value: /var/data/backups
      - key: SESSION_SECRET
        generateValue: true
      - key: AI_SAFETY_IDENTIFIER_SECRET
        generateValue: true
      - key: PUBLIC_APP_ORIGIN
        sync: false
      - key: PUBLIC_INDEXING_ENABLED
        value: false
      - key: COPYQUICK_EXECUTION_MODE
        value: acceptance
      - key: AI_PROVIDER
        value: deterministic
      - key: AI_DISCOVERY_ENABLED
        value: false
      - key: AI_STRATEGY_ENABLED
        value: false
      - key: OPENAI_RESEARCH_ENABLED
        value: false
      - key: OFFSITE_BACKUP_ENABLED
        value: false
      - key: OFFSITE_BACKUP_SCHEDULE_ENABLED
        value: false
      - key: BACKUP_HEALTH_ALERTS_ENABLED
        value: false
      - key: STRIPE_RECONCILIATION_ENABLED
        value: false
      - key: STRIPE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRO_PRICE
        sync: false
      - key: STRIPE_UNLIMITED_PRICE
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /healthz
