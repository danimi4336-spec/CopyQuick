name: CI

on:
  push:
    branches:
      - next-gen
  pull_request:
    branches:
      - next-gen

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node 24 validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      AI_PROVIDER: deterministic
      AI_DISCOVERY_ENABLED: "false"
      AI_STRATEGY_ENABLED: "false"
      OPENAI_RESEARCH_ENABLED: "false"
      OFFSITE_BACKUP_ENABLED: "false"
      STRIPE_RECONCILIATION_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Use Node.js 24.20.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Check JavaScript syntax
        run: find . -path ./node_modules -prune -o -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check whitespace
        run: git diff --check HEAD^ HEAD

      - name: Run complete isolated suite
        run: npm test
